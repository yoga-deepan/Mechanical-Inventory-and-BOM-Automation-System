{% extends 'base.html' %}

{% block title %}Dashboard - Mechanical ERP{% endblock %}

{% block content %}
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>🔧 Mechanical ERP</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="nav-item active">Dashboard</a>
            <a href="/components/" class="nav-item">Components</a>
            <a href="/projects/" class="nav-item">Projects</a>
            <a href="/analytics/" class="nav-item">Analytics</a>
        </nav>
    </aside>
    
    <main class="main-content">
        <div class="top-navbar">
            <h1>Dashboard</h1>
            <div class="user-info">
                <span>Workshop Control Panel</span>
            </div>
        </div>
        
        <div class="card-grid" id="statsCards">
            <!-- Stats cards will be loaded here -->
        </div>
        
        <div class="table-container">
            <div class="table-header">
                <h2>Low Stock Alerts</h2>
                <button class="btn-primary" onclick="triggerLowStockCheck()">Check Now</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Component</th>
                        <th>Category</th>
                        <th>Current Stock</th>
                        <th>Min Level</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="lowStockTable">
                    <!-- Low stock items will be loaded here -->
                </tbody>
            </table>
        </div>
    </main>
</div>

<script>
async function loadDashboard() {
    try {
        const [analytics, components] = await Promise.all([
            AnalyticsAPI.getData(),
            ComponentsAPI.getAll()
        ]);
        
        // Load stats cards
        const statsCards = document.getElementById('statsCards');
        statsCards.innerHTML = `
            <div class="card">
                <h3>Total Projects</h3>
                <div class="value">${analytics.project_stats.total}</div>
            </div>
            <div class="card">
                <h3>In Progress</h3>
                <div class="value">${analytics.project_stats.in_progress}</div>
            </div>
            <div class="card">
                <h3>Low Stock Items</h3>
                <div class="value">${analytics.low_stock_count}</div>
            </div>
            <div class="card">
                <h3>Inventory Value</h3>
                <div class="value">${formatCurrency(analytics.total_inventory_value)}</div>
            </div>
        `;
        
        // Load low stock items
        const lowStockItems = components.filter(c => c.is_low_stock);
        const lowStockTable = document.getElementById('lowStockTable');
        
        if (lowStockItems.length === 0) {
            lowStockTable.innerHTML = '<tr><td colspan="5" style="text-align: center;">No low stock items</td></tr>';
        } else {
            lowStockTable.innerHTML = lowStockItems.map(item => `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.category}</td>
                    <td>${item.current_stock}</td>
                    <td>${item.min_stock_level}</td>
                    <td><span class="badge badge-danger">Low Stock</span></td>
                </tr>
            `).join('');
        }
    } catch (error) {
        showAlert('Failed to load dashboard: ' + error.message, 'danger');
    }
}

async function triggerLowStockCheck() {
    try {
        await apiRequest('/trigger-low-stock/', { method: 'POST' });
        showAlert('Low stock check triggered successfully');
    } catch (error) {
        showAlert('Failed to trigger check: ' + error.message, 'danger');
    }
}

loadDashboard();
</script>
{% endblock %}
